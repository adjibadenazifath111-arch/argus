input {
  beats {
    port => 5044
  }
}

filter {
  if [log_source] == "snort" {

    # --------------------------------------------------------
    # ALERTES IPv4 avec ports
    # --------------------------------------------------------
    grok {
      match => {
        "message" => [
          "^\s*%{DATA:[snort][timestamp]}\s+\[\*\*\]\s+\[%{INT:[snort][generator]}:%{INT:[snort][signature_id]}:%{INT:[snort][revision]}\]\s+%{DATA:[snort][signature]}\s+\[\*\*\]\s+(\[Classification:\s+%{DATA:[snort][classification]}\]\s+)?(\[Priority:\s+%{INT:[snort][priority]}\]\s+)?\{%{WORD:[network][transport]}\}\s+%{IP:[source][ip]}:%{INT:[source][port]}\s+->\s+%{IP:[destination][ip]}:%{INT:[destination][port]}"
        ]
      }
      tag_on_failure => ["_snort_grok_failure"]
    }

    # --------------------------------------------------------
    # ALERTES IPv6 sans ports
    # --------------------------------------------------------
    if "_snort_grok_failure" in [tags] {
      grok {
        match => {
          "message" => [
            "^\s*%{DATA:[snort][timestamp]}\s+\[\*\*\]\s+\[%{INT:[snort][generator]}:%{INT:[snort][signature_id]}:%{INT:[snort][revision]}\]\s+%{DATA:[snort][signature]}\s+\[\*\*\]\s+(\[Classification:\s+%{DATA:[snort][classification]}\]\s+)?(\[Priority:\s+%{INT:[snort][priority]}\]\s+)?\{%{WORD:[network][transport]}\}\s+%{IP:[source][ip]}\s+->\s+%{IP:[destination][ip]}"
          ]
        }
        tag_on_failure => ["_snort_ipv6_grok_failure"]
      }
    }

    # --------------------------------------------------------
    # TYPES
    # --------------------------------------------------------
    mutate {
      convert => {
        "[snort][generator]" => "integer"
        "[snort][signature_id]" => "integer"
        "[snort][revision]" => "integer"
        "[snort][priority]" => "integer"
        "[source][port]" => "integer"
        "[destination][port]" => "integer"
      }
      add_field => {
        "[event][module]" => "snort"
        "[event][dataset]" => "snort.alert"
      }
      remove_tag => ["_snort_grok_failure", "_snort_ipv6_grok_failure"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "__ELASTIC_PASSWORD__"
    index => "logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
