name: argus-elk

# =============================================================================
#  ARGUS — stack Elastic 9.1.3 (reproduction locale)
#  TLS interne sur CA auto-signée. Syntaxe Compose spec moderne (docker-compose v5).
#  Secrets : /opt/elk/.env (600)
# =============================================================================

services:

  # ---------------------------------------------------------------- ES -------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    container_name: elk-elasticsearch
    profiles: ["elk"]
    environment:
      node.name: argus-es-01
      cluster.name: argus-lab
      discovery.type: single-node
      bootstrap.memory_lock: "false"

      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}

      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt

      xpack.license.self_generated.type: basic

      # garde-fou disque : evite le saturation du volume racine (cf. incident Wazuh)
      cluster.routing.allocation.disk.watermark.low: 85%
      cluster.routing.allocation.disk.watermark.high: 90%
      cluster.routing.allocation.disk.watermark.flood_stage: 95%

      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - ./data/elasticsearch:/usr/share/elasticsearch/data
      - ./logs/elasticsearch:/usr/share/elasticsearch/logs
    ports:
      # 9200 sur la boucle locale : acces hote (scripts, verification TLS).
      # 9200 sur vmnet8 : c'est par la que les agents de la VM endpoint
      # (Elastic Agent et son packetbeat managé, Packetbeat et Filebeat
      # autonomes) ecrivent dans ES. L'interface vmnet8 (172.16.182.0/24)
      # est un pont hote-only, sans route vers l'exterieur : l'exposition
      # reste confinee au labo.
      # 9200 sur wlan0 : idem raison pour l'agent Windows du poste
      # "soutenance", qui n'est ni dans le labo VMware ni derriere un
      # /etc/hosts et joint donc ES par l'adresse LAN. C'est la seule
      # exposition de ES hors labo ; le certificat a ete reemis avec
      # IP:10.50.17.91 dans le SAN pour que la verification "full" passe
      # (certs/openssl.cnf, section [elasticsearch]).
      # Kibana (5601) n'est volontairement PAS publie : il reste accessible
      # depuis le navigateur de l'hote uniquement.
      - "127.0.0.1:9200:9200"
    networks: [elk-network]
    restart: unless-stopped

  # ------------------------------------------------------------ KIBANA -------
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    container_name: elk-kibana
    profiles: ["elk"]
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: '["https://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca/ca.crt
      ELASTICSEARCH_SSL_VERIFICATIONMODE: full

      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /usr/share/kibana/config/certs/kibana/kibana.crt
      SERVER_SSL_KEY: /usr/share/kibana/config/certs/kibana/kibana.key

      # Cle de chiffrement des saved objects (encrypted saved objects).
      # C'est elle que verifie appContextService.getEncryptedSavedObjectsSetup().canEncrypt,
      # condition pour creer un hote Fleet Server. Sans elle, POST /api/fleet/setup
      # echoue et le Fleet Server reste bloque sur "Waiting on policy".
      # Kibana N'ACCEPTE PAS le nom pointe en minuscules comme variable
      # d'environnement : il faut la forme majuscule, comme les autres cles
      # ci-dessus (XPACK_SECURITY_ENCRYPTIONKEY...). En minuscules, le reglage
      # est silencieusement ignore.
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${ESO_KEY}
      SERVER_PUBLICBASEURL: https://localhost:5601

      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_SECURITY_SOLUTION_VIEWS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    volumes:
      - ./certs:/usr/share/kibana/config/certs:ro
    ports:
      - "127.0.0.1:5601:5601"
    networks: [elk-network]
    restart: unless-stopped

  # ----------------------------------------------------------- LOGSTASH -------
  # --- LOGSTASH VOLONTAIREMENT ABSENT -------------------------------------
  # Le pipeline de parsing Snort (grok) a ete porte dans un pipeline
  # d'ingestion natif Elasticsearch : voir configs/ingest_snort.json
  #   - role identique (grok + mutate), aucun JVM, ~900 Mo de RAM econ.
  #   - Packetbeat et Elastic Agent ecrivent directement dans ES.
  # Justification et consequences : voir 02_installation_stack_elk_tls.md

  # -------------------------------------------------------- FLEET SERVER ----
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.1.3
    container_name: elk-fleet-server
    profiles: ["elk"]
    depends_on: [elasticsearch, kibana]
    command: >
      elastic-agent run -c /usr/share/elastic-agent/elastic-agent.yml
    environment:
      FLEET_SERVER_ENABLE: "1"
      # Noms exacts imposes par "elastic-agent container --help" :
      #   FLEET_SERVER_ELASTICSEARCH_HOST  (singulier ! le pluriel est ignore)
      #   FLEET_SERVER_ELASTICSEARCH_CA
      #   FLEET_SERVER_CERT / FLEET_SERVER_CERT_KEY  (et non FLEET_SERVER_KEY :
      #     une variable mal nommee est silencieusement ignoree, d'ou
      #     "certificate private key is required when certificate provided")
      FLEET_SERVER_ELASTICSEARCH_HOST: 'https://elasticsearch:9200'
      FLEET_SERVER_ELASTICSEARCH_USERNAME: elastic
      FLEET_SERVER_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
      FLEET_SERVER_ELASTICSEARCH_CA: /usr/share/elastic-agent/config/certs/ca/ca.crt
      FLEET_SERVER_CERT: /usr/share/elastic-agent/config/certs/fleet-server/fleet-server.crt
      FLEET_SERVER_CERT_KEY: /usr/share/elastic-agent/config/certs/fleet-server/fleet-server.key
      FLEET_SERVER_INSECURE_HTTP: "0"
      FLEET_SERVER_CLIENT_AUTH: "none"

      # FLEET_SERVER_ENABLE force deja l'enrolement : le jeton est recupere
      # automatiquement via Kibana, pas besoin de FLEET_ENROLL ni FLEET_URL.
      FLEET_SERVER_POLICY_ID: ${FLEET_SERVER_POLICY_ID:-fleet-server-policy}

      # En revanche FLEET_URL est obligatoire des qu'un certificat est fourni
      # ("url is required when a certificate is provided"). Le Fleet Server
      # s'enrole donc dans lui-meme via son nom de service Docker.
      FLEET_URL: https://fleet-server:8220
      FLEET_CA: /usr/share/elastic-agent/config/certs/ca/ca.crt

      KIBANA_FLEET_HOST: https://kibana:5601
      KIBANA_FLEET_CA: /usr/share/elastic-agent/config/certs/ca/ca.crt
      # Compte elastic et non kibana_system : en 9.1.3, Kibana n'a enregistre
      # aucun privilege applicatif Fleet dans ES (kibana-.kibana expose 0
      # privilege), donc meme un role sur mesure ne peut pas obtenir
      # fleet-agents-all. Le superutilisateur passe.
      KIBANA_FLEET_USERNAME: elastic
      KIBANA_FLEET_PASSWORD: ${ELASTIC_PASSWORD}

    volumes:
      - ./certs:/usr/share/elastic-agent/config/certs:ro
      - ./data/fleet-server:/usr/share/elastic-agent/state:rw
    ports:
      # 8220 expose sur l'interface : c'est le port d'enrolement Fleet que
      # l'Elastic Agent de la VM endpoint doit joindre. 9200/5601 restent
      # boucle-locale, l'agent ne parle qu'a Fleet.
      - "0.0.0.0:8220:8220"
    extra_hosts:
      - "argus-srv.lab:10.50.17.91"
    networks: [elk-network]
    restart: unless-stopped

networks:
  elk-network:
    # Pre-existant (cree hors compose) : partage avec l'Elastic Agent de la
    # VM endpoint, qui doit joindre Fleet Server sur le port 8220.
    name: elk-network
    external: true

